version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app # Live mount backend code
      - downloads_data:/app/downloads
    environment:
      - PYTHONUNBUFFERED=1
      - music_dir=/app/downloads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # Live mount frontend code
      - /app/node_modules # Prevent overwriting node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  downloads_data:
